---
layout: default
---
<div class="container sections-stack">
  <header class="glass-card section-glass reveal page-header" style="padding-bottom:2rem;text-align:center">
    <h1 class="section-title">{{ page.title }}</h1>
    {% if page.subtitle %}
    <p class="section-subtitle" style="margin:0.75rem auto 0">{{ page.subtitle }}</p>
    {% endif %}
  </header>

  <section class="section section--tight" style="padding-top:0;padding-bottom:var(--section-gap)">
    <div class="glass-card section-glass markdown-body reveal">
      {{ content }}
    </div>
  </section>
</div>
