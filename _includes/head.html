<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ page.description | default: site.description | escape }}" />
  <meta name="theme-color" content="{{ site.theme_colors.sky }}" />
  <meta property="og:title" content="{{ page.title | default: site.title }} | {{ site.data.profile.role }}" />
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}" />
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.data.profile.name }}</title>
  <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/css/markdown.css' | relative_url }}" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23BFDDF0'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23FFFFFF'/%3E%3C/svg%3E" />
</head>
