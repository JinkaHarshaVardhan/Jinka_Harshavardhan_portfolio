<div class="bento-grid" id="project-grid">
  {% for project in site.data.projects %}
  <article class="glass-card project-card span-6 reveal" data-category="{{ project.category }}">
    <span class="tag{% if project.category == 'ml' or project.category == 'agentic' %} tag--peach{% endif %}">{{ project.tag }}</span>
    <h3>{{ project.title }}</h3>
    <p>{{ project.summary }}</p>
    <div style="display:flex;gap:0.75rem;margin-top:1rem;flex-wrap:wrap">
      <a href="{{ project.detail_url | relative_url }}" class="btn btn--primary">Details</a>
      {% if project.research_url %}
      <a href="{{ project.research_url | relative_url }}" class="btn btn--ghost">Research</a>
      {% endif %}
    </div>
  </article>
  {% endfor %}
</div>
