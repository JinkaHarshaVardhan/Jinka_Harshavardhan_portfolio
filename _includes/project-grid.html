<div class="project-grid project-grid--squares" id="project-grid">
  {% for project in site.data.projects %}
  <article class="glass-card project-card project-card--square reveal" data-category="{{ project.category }}">
    <span class="tag">{{ project.tag }}</span>
    <h3>{{ project.title }}</h3>
    <p>{{ project.summary }}</p>
    <div class="project-card__actions">
      <a href="{{ project.detail_url | relative_url }}" class="btn btn--primary">Details</a>
    </div>
  </article>
  {% endfor %}
</div>
